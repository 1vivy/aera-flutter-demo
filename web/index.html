<!DOCTYPE html>
<html>
<head>
  <!-- WebUI hosts serve the module's webroot at the site root; keep "/". -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A surfaces app.">
  <title>Surfaces Demo</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <!--
    Host styles. KernelSU, SukiSU, KernelSU Next, APatch and WebUI X serve
    these virtual files: the safe-area insets as CSS variables (asking for
    this file also turns edge-to-edge on) and the Material You colours.
    surfaces_webui reads both. Only asked for inside a root manager, so a
    plain browser does not log 404s.
  -->
  <script>
    if (window.ksu || window.webui) {
      ['insets', 'colors'].forEach(function (name) {
        document.write('<link rel="stylesheet" href="/internal/' + name + '.css">');
      });
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #121212; color: #e6e1e5; }
    @media (prefers-color-scheme: light) { html, body { background: #fef7ff; color: #1d1b20; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; font: 16px system-ui, sans-serif; }
    #splash .ring { width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid currentColor; border-right-color: transparent;
      animation: spin 0.9s linear infinite; opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // ES5 on purpose: runs on WebViews too old for Flutter and sends them to
    // fallback.html (Flutter web needs WebAssembly and Chromium 85+ syntax).
    (function () {
      var ok = typeof WebAssembly === 'object';
      try { new Function('var a; a ??= 1; return a?.b;'); } catch (e) { ok = false; }
      if (!ok) { location.replace('fallback.html'); }
    })();
  </script>
</head>
<body>
  <div id="splash"><div class="ring"></div><div>Surfaces Demo</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.remove(); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
