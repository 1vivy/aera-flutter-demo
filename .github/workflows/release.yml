# Builds the demo .aerap and publishes it as release v<version> (from
# aera.json). Needs the kits release for this Flutter version in
# 1vivy/aera-flutter-embedder. Run it from the Actions tab.
name: Release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: tool/aera.sh package
      - id: meta
        run: |
          echo "version=$(python3 -c "import json; print(json.load(open('aera.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: generic-host-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Flutter Demo ${{ steps.meta.outputs.version }}
          body: |
            For AERA's generic pixel + GPU plugin host, which is not released yet (assumed interface). Install from AERA's plugin screen once a build with that host is out. It installs under its own ID next to AERA Browser.
          prerelease: true
          files: build/aera/*.aerap
