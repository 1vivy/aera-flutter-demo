# Builds every target and publishes them as release v<version> (from
# surfaces.yaml): the KernelSU / WebUI X module zip, the AERA .aerap, the
# hosted web build and a Linux desktop build. The AERA build needs the kits
# release for this Flutter version in 1vivy/aera-flutter-embedder. Run it
# from the Actions tab.
name: Release
on:
  workflow_dispatch:
    inputs:
      renderer:
        description: How the AERA build draws
        type: choice
        options: [gl, vulkan, impeller]
        default: gl
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y zip xz-utils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libgtk-3-dev ninja-build
      - run: rustup target add wasm32-unknown-unknown aarch64-unknown-linux-musl x86_64-unknown-linux-musl aarch64-unknown-linux-gnu
      - run: flutter pub get
      - run: dart run surfaces_cli:surfaces build all
        env:
          AERA_RENDERER: ${{ inputs.renderer }}
      - id: meta
        run: echo "version=$(sed -n 's/^version: *//p' surfaces.yaml | tr -d '\"')" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" --title "v${{ steps.meta.outputs.version }}" \
            --notes "Built from ${{ github.sha }} with Flutter 3.47.5." \
            build/webui/*.zip build/aera/*.aerap build/*-web.zip build/*-linux-x64.tar.gz
