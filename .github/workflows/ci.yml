name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y zip libgtk-3-dev ninja-build
      - run: rustup target add wasm32-unknown-unknown aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - run: cargo test --manifest-path rust/Cargo.toml -p app_core
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The KernelSU / WebUI X module: web build, core.wasm and root workers.
      - run: dart run surfaces_cli:surfaces build webui
      - uses: actions/upload-artifact@v4
        with:
          name: webui-module
          path: build/webui/*.zip
