name: surfaces_demo
description: "The surfaces demo: one page per feature, on KernelSU / WebUI X, the web, AERA Recovery and desktop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  app_native:
    path: rust_builder
  surfaces:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 5f7fde170bd418be889b991c025325812b6c3cea
      path: packages/surfaces
  surfaces_ui:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 5f7fde170bd418be889b991c025325812b6c3cea
      path: packages/surfaces_ui
  surfaces_webui:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 5f7fde170bd418be889b991c025325812b6c3cea
      path: packages/surfaces_webui
  surfaces_aera:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 5f7fde170bd418be889b991c025325812b6c3cea
      path: packages/surfaces_aera

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  surfaces_cli:
    git:
      url: https://github.com/1vivy/aera-flutter-sdk
      ref: 5f7fde170bd418be889b991c025325812b6c3cea
      path: tools/cli

flutter:
  uses-material-design: true
